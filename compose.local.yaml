# Windows/Linux local development. Only PostgreSQL; run the app with npm run dev.
name: cor-local
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: cor
      POSTGRES_USER: cor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - cor_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cor -d cor"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  cor_local_data:
