name: Bug report
description: Report a reproducible problem without personal data.
body:
  - type: markdown
    attributes:
      value: Do not include tokens, cookies, personal records or OAuth URLs. Report security issues privately.
  - type: textarea
    id: problem
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce with demo data
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version, operating system and installation method
    validations:
      required: true
